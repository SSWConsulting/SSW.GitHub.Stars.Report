name: Star report

on:
  schedule:
    # GitHub cron is UTC only, so these are converted to land at 10:00 in Sydney
    # on 1 Jan / 1 Apr / 1 Jul / 1 Oct (Jan & Apr are AEDT +11, Jul & Oct AEST +10).
    - cron: "0 0 1 7,10 *" # 10:00 AEST on 1 Jul & 1 Oct
    - cron: "0 23 31 3 *" # 10:00 AEDT on 1 Apr (fires 31 Mar 23:00 UTC)
    - cron: "0 23 31 12 *" # 10:00 AEDT on 1 Jan (fires 31 Dec 23:00 UTC)
  workflow_dispatch: {} # allow manual runs to test

permissions:
  contents: write # commit the updated history file

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Sydney # so the recorded checkpoint date is the Sydney calendar day
    steps:
      - uses: actions/checkout@v4

      - name: Record star checkpoint
        id: report
        env:
          # ORG_READ_TOKEN = a PAT with read access to the private SSW repos
          # (YakShaver, EagleEye). Falls back to GITHUB_TOKEN for public repos.
          # The repo list lives in stars-history.json, grouped by org.
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
          REPORT_URL: "https://sswconsulting.github.io/${{ github.event.repository.name }}/"
        run: python .github/scripts/star_report.py # also writes email.html

      - name: Commit updated history
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add public/stars-history.json
          git commit -m "Star checkpoint ${{ steps.report.outputs.date }}" || echo "no change"
          git push

      - name: Notify Microsoft Teams
        env:
          # Create in Teams: channel ••• → Workflows → "Post to a channel when a
          # webhook request is received" → paste the generated URL as this secret.
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DATE: ${{ steps.report.outputs.date }}
          REPORT_URL: "https://sswconsulting.github.io/${{ github.event.repository.name }}/"
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL not set — skipping notification."; exit 0
          fi
          PRETTY=$(date -d "$DATE" +"%d %b %Y") # ISO -> DD MMM YYYY (e.g. 08 Jul 2026)
          # Scheduled quarterly runs @mention everyone (always:false people are
          # included only then); manual test runs mention Tiago only (always:true).
          jq -n --arg date "$PRETTY" --arg url "$REPORT_URL" --arg event "$GITHUB_EVENT_NAME" '
            ($event == "schedule") as $sched
            | [
                { name: "Adam Cogan",    id: "adamcogan@ssw.com.au",    always: false },
                { name: "Tiago Araujo",  id: "tiagoaraujo@ssw.com.au",  always: true  },
                { name: "Calum Simpson", id: "calumsimpson@ssw.com.au", always: false }
              ]
            | map(select(.always or $sched)) as $people
            | {
                type: "message",
                attachments: [{
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      { type: "TextBlock", size: "Large", weight: "Bolder", text: "📊 GitHub Stars Report" },
                      { type: "TextBlock", wrap: true, text: ("Quarterly checkpoint saved on **" + $date + "**.") },
                      { type: "TextBlock", wrap: true, text: ("cc " + ([$people[] | "<at>" + .name + "</at>"] | join(" "))) }
                    ],
                    actions: [
                      { type: "Action.OpenUrl", title: "View the full report →", url: $url }
                    ],
                    msteams: {
                      entities: [ $people[] | { type: "mention", text: ("<at>" + .name + "</at>"), mentioned: { id: .id, name: .name } } ]
                    }
                  }
                }]
              }' | curl -sS -X POST "$TEAMS_WEBHOOK_URL" -H "Content-Type: application/json" -d @-

      - name: Email the report (Power Automate)
        env:
          # Power Automate flow: "When a Teams webhook request is received" ->
          # "Office 365 Outlook: Send an email (V2)". It reads { subject, html } and
          # sends from the flow owner's mailbox (OAuth, no SMTP). Recipients (To =
          # Adam, CC = Tiago + Calum) are configured inside the flow, not here.
          # If the secret is unset, this step is skipped.
          EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}
          DATE: ${{ steps.report.outputs.date }}
        run: |
          if [ -z "$EMAIL_WEBHOOK_URL" ]; then
            echo "EMAIL_WEBHOOK_URL not set — skipping email."; exit 0
          fi
          [ -f email.html ] || { echo "email.html missing — skipping."; exit 0; }
          # Quarter number from the run month: Jan=1, Apr=2, Jul=3, Oct=4.
          QNUM=$(( ( $(date -d "$DATE" +%-m) - 1) / 3 + 1 ))
          YEAR=$(date -d "$DATE" +%Y)
          jq -n --arg subject "GitHub Stars Quarterly Report (#${QNUM} of ${YEAR}) | SSW + TinaCMS" \
                --rawfile html email.html \
                '{ subject: $subject, html: $html }' \
            | curl -sS -X POST "$EMAIL_WEBHOOK_URL" -H "Content-Type: application/json" -d @-
